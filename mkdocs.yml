site_name: WHITE LIES
site_description: Does moving first help in chess? A clear guide to the evidence from 836,070 Lichess games played in March 2025.
# Verified live on 2026-11-15; the workflow overrides this with Pages base_url.
site_url: !ENV [SITE_URL, 'https://blevis.github.io/White_Lies-Is_the_First-Move_Advantage_Real/']
repo_url: https://github.com/Blevis/White_Lies-Is_the_First-Move_Advantage_Real
repo_name: Blevis / White Lies
edit_uri: blob/main/docs/
strict: true
use_directory_urls: true
theme:
  name: material
  custom_dir: overrides
  language: en
  font: false
  logo: assets/images/mark.svg
  favicon: assets/images/mark.svg
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.view
    - content.tabs.link
    - toc.follow
plugins:
  - search
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.critic
  - pymdownx.keys
extra_css:
  - assets/css/site.css
  - assets/css/explorer.css
  - assets/css/study.css
extra_javascript:
  - assets/js/site.js
  - assets/js/explorer.js
extra:
  generator: false
copyright: March 2025 Lichess study · Data, code and results available
nav:
  - Home: index.md
  - The study:
      - 1. Questions and concepts: research/question.md
      - 2. Collect and prepare data: research/approach.md
      - 3. H1 — White's score: research/h1.md
      - 4. H2 — Black's replies: research/h2.md
      - 5. Checks and limits: research/limitations.md
      - 6. The conclusion: research/findings.md
      - Study reference: research/reference.md
  - Explore:
      - Data explorer: explore/index.md
      - Charts explained: explore/figures.md
      - Explore opening replies: explore/openings.md
  - Detailed methods:
      - Data and source checks: methodology/data.md
      - Sampling and exclusions: methodology/sampling.md
      - Scores, weights and tests: methodology/statistics.md
      - Understanding uncertainty: methodology/uncertainty.md
      - Rating adjustments: methodology/ratings.md
      - Testing other choices: methodology/robustness.md
      - Full research report: research/report.md
  - Reproduce the work:
      - Set up Python: reproducibility/installation.md
      - Run the analysis: reproducibility/running.md
      - Notebook guide: reproducibility/notebook.md
      - Output files: reproducibility/outputs.md
      - Validation and testing: reproducibility/validation.md
  - Project:
      - Research sources: project/sources.md
      - Repository structure: project/structure.md
      - Research audit: project/audit.md
      - Website maintenance: project/website.md
      - About and contributors: project/about.md
hooks:
  - scripts/docs_hook.py
