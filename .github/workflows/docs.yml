name: Research website

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'overrides/**'
      - 'scripts/build_docs_assets.py'
      - 'scripts/docs_hook.py'
      - 'scripts/check_site.py'
      - 'results/**'
      - 'reports/**'
      - 'figures/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'overrides/**'
      - 'scripts/build_docs_assets.py'
      - 'scripts/docs_hook.py'
      - 'scripts/check_site.py'
      - 'results/**'
      - 'reports/**'
      - 'figures/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      NO_MKDOCS_2_WARNING: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install publication dependencies only
        run: python -m pip install -r requirements-docs.txt
      - name: Verify committed publication inputs
        run: python scripts/build_docs_assets.py --check
      - name: Read the configured Pages URL
        id: pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Build and validate static publication
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url && format('{0}/', steps.pages.outputs.base_url) || '' }}
        run: |
          python -m mkdocs build --strict
          python scripts/check_site.py
      - name: Upload verified static site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified publication
        id: deployment
        uses: actions/deploy-pages@v4
